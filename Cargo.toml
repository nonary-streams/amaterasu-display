[package]
name = "amaterasu-display"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
amaterasu-module-sdk = { path = "../../crates/module-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
amaterasu-windows-capture-geometry = { path = "../../crates/windows-capture-geometry" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_Display", "Win32_Graphics_Gdi"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
